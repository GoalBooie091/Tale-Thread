<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - StoryCrafter</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
  <header>
    <h1>StoryCrafter</h1>
  </header>
  <main style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 400px; text-align: center;">
      <h2>Welcome Back</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Login</button>
      </form>
      <p style="margin-top: 15px;">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>
  
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      if (res.ok) {
        window.location.href = 'editor.html';
      } else {
        const data = await res.json();
        alert(data.error || 'Login failed');
      }
    });
  </script>
</body>
</html>
