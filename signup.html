<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - StoryCrafter</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="signup-page">
  <header>
    <h1>StoryCrafter</h1>
  </header>
  <main style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 400px; text-align: center;">
      <h2>Create an Account</h2>
      <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Sign Up</button>
      </form>
      <p style="margin-top: 15px;">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      
      if (res.ok) {
        alert('Signup successful! Please login.');
        window.location.href = 'login.html';
      } else {
        const data = await res.json();
        alert(data.error || 'Signup failed');
      }
    });
  </script>
</body>
</html>
